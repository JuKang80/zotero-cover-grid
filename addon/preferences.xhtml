<vbox id="zotero-prefpane-cover-grid"
      xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml">
  <vbox class="main-section" style="padding: 16px;">
    <html:div style="font-size: 13px; color: var(--text-muted, #6b7280); margin-bottom: 16px; line-height: 1.5;">
      논문 목록을 첫 페이지 표지 서가 형태로 시각화해 주는 Zotero 전용 확장기능입니다.
      상단 검색창 옆의 뷰 전환 버튼 [ ≡ | ⊞ ]을 클릭하면 리스트 뷰와 표지 서가(Cover Grid) 뷰를 즉시 전환할 수 있습니다.
    </html:div>

    <separator class="thin" style="margin: 12px 0;" />

    <hbox align="center" style="margin-top: 10px;">
      <label value="기본 카드 크기 (Default Card Width):" style="width: 230px; font-weight: 500;" />
      <html:input type="number"
                  id="pref-card-width"
                  preference="extensions.zotero.covergrid.cardWidth"
                  min="140"
                  max="340"
                  value="180"
                  style="width: 70px; padding: 4px; border-radius: 4px; border: 1px solid #ccc;" />
      <label value="px (140px ~ 340px)" style="margin-left: 6px; color: #888;" />
    </hbox>

    <hbox align="center" style="margin-top: 14px;">
      <checkbox id="pref-splash-detect"
                preference="extensions.zotero.covergrid.splashDetect"
                label="출판사 안내문(JSTOR 등) 자동 건너뛰고 2페이지를 표지로 설정"
                checked="true" />
    </hbox>

    <hbox align="center" style="margin-top: 10px;">
      <checkbox id="pref-show-tag-band"
                preference="extensions.zotero.covergrid.showTagBand"
                label="타이포그래피 북커버에 컬러 태그 앰비언트 틴트(띠지) 표시"
                checked="true" />
    </hbox>
  </vbox>
</vbox>
