name: Release XPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package Extension XPI
        run: npm run package

      - name: Run Test Suite
        run: npm run test

      - name: Run TypeScript Check
        run: npm run type-check

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/zotero-cover-grid.xpi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync updates.json hash to main
        run: |
          if ! git diff --quiet -- addon/updates.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin main
            git checkout -B main origin/main
            git checkout --theirs -- addon/updates.json || true
            node scripts/make-xpi.mjs
            git add addon/updates.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(release): sync updates.json sha256 for ${{ github.ref_name }} [skip ci]"
              git push origin main
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
